<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi — Lumora</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Inter:wght@400;430;450;480;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
  <a class="brand brand--logo" href="/"><img src="/logo.svg" alt="Lumora" width="180" height="48"></a>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1 class="display-sm" style="font-size:32px;">Lupa kata sandi</h1>
      <p class="auth-sub">Masukkan email, kami kirim tautan reset.</p>
      <form id="fpForm" class="auth-form" novalidate>
        <label><span class="field-label">Email</span><input type="email" name="email" required autocomplete="email" placeholder="nama@instansi.id"></label>
        <button type="submit" class="btn btn-primary btn-block">Kirim tautan reset</button>
        <div class="auth-links"><a href="/login.html">← Kembali ke masuk</a></div>
        <p class="form-status" id="fpStatus" role="status" aria-live="polite"></p>
      </form>
      <!-- ponytail: tanpa email service, tampilkan pesan sukses saja. Upgrade: kirim reset token via SES -->
    </div>
  </main>

  <script type="module">
    const f = document.getElementById('fpForm');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = f.email.value;
      const st = document.getElementById('fpStatus');
      try {
        const r = await fetch('/api/auth/forgot', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ email }) });
        const j = await r.json();
        st.textContent = j.ok ? 'Tautan reset terkirim. Cek inbox Anda.' : (j.error || 'Gagal kirim, coba lagi.');
        st.className = 'form-status ' + (j.ok ? 'ok' : 'err');
      } catch {
        st.textContent = 'Tidak terhubung ke server.';
        st.className = 'form-status err';
      }
    });
  </script>
</body>
</html>
